name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
          - target: x86_64-linux-musl
          - target: aarch64-linux-musl
          - target: x86_64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp zig-out/lib/libstb-image-opt.a dist/${{ matrix.target }}/
          cp src/stb_image.h dist/${{ matrix.target }}/
          (cd dist && tar czf stb-image-opt-${{ matrix.target }}.tar.gz ${{ matrix.target }})
      - uses: actions/upload-artifact@v4
        with:
          name: stb-image-opt-${{ matrix.target }}
          path: dist/stb-image-opt-${{ matrix.target }}.tar.gz

  release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "stb-image-opt ${GITHUB_REF_NAME}: drop-in optimized stb_image.h (see CHANGELOG.md)." \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
